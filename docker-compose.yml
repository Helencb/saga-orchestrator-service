version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: saga-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saga_db
      MYSQL_USER: saga_db
      MYSQL_PASSWORD: saga_db
    ports:
      - "3306:3306"
    volumes:
      - saga-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: saga-rabbitmq
    ports:
      - "5672:5672"   # protocolo AMQP
      - "15672:15672" # UI de administração (http://localhost:15672, guest/guest)
    volumes:
      - saga-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: saga-orchestrator-service
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      # O eureka-server é um projeto separado, rodado fora deste compose (ver
      # repositório eureka-server). host.docker.internal alcança o host a partir
      # do container no Docker Desktop (Windows/Mac); no Linux use a rede do host
      # ou aponte para o IP/hostname real de onde o Eureka estiver rodando.
      EUREKA_HOST: host.docker.internal
      EUREKA_USERNAME: admin
      EUREKA_PASSWORD: "123456"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  saga-mysql-data:
  saga-rabbitmq-data:
