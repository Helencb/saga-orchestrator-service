version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: saga-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saga_db
      MYSQL_USER: saga_db
      MYSQL_PASSWORD: saga_db
    ports:
      - "3306:3306"
    volumes:
      - saga-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.4
    container_name: saga-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs, sns
      - DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - saga-localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  saga-mysql-data:
  saga-localstack-data: